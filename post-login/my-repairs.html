<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Repairs — Repair Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <script src="app.js"></script>
  <div class="dash-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="logo-mark"><svg width="22" height="22" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <text
            x="50%"
            y="52%"
            text-anchor="middle"
            dominant-baseline="middle"
            font-family="Poppins, Arial, sans-serif"
            font-size="53"
            font-weight="650"
            letter-spacing="0"
            fill="#FFFFFF">
            Rp
        </text>
    </svg></span>
      <span class="sidebar-brand-name">Repair Partner</span>
      <button class="sidebar-close" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Menu</div>
      <a href="dashboard.html" class="sidebar-link" data-page="dashboard.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke-width="1.7"/><rect x="13" y="3" width="8" height="5" rx="1.5" stroke-width="1.7"/><rect x="13" y="12" width="8" height="9" rx="1.5" stroke-width="1.7"/><rect x="3" y="15" width="8" height="6" rx="1.5" stroke-width="1.7"/></svg>
        Dashboard
      </a>
      <a href="my-repairs.html" class="sidebar-link" data-page="my-repairs.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.3 2.3-2-2 2.3-2.3z" stroke-width="1.7" stroke-linejoin="round"/></svg>
        My Repairs
      </a>
      <a href="book-repair.html" class="sidebar-link" data-page="book-repair.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke-width="1.8" stroke-linecap="round"/></svg>
        Book New Repair
      </a>
      <a href="bulk-repair.html" class="sidebar-link" data-page="bulk-repair.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="7" height="7" rx="1.4" stroke-width="1.7"/><rect x="14" y="4" width="7" height="7" rx="1.4" stroke-width="1.7"/><rect x="3" y="13" width="7" height="7" rx="1.4" stroke-width="1.7"/><rect x="14" y="13" width="7" height="7" rx="1.4" stroke-width="1.7"/></svg>
        Bulk Repair Request
      </a>
      <div class="sidebar-cta">
        <p>Need help with an ongoing repair?</p>
        <a href="contact-support.html" class="btn btn-secondary btn-sm btn-block">Contact Support</a>
      </div>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ============ MAIN ============ -->
  <div class="dash-main">
    <header class="dash-topbar">
      <button class="topbar-menu-btn" aria-label="Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <h1 class="topbar-title">My Repairs</h1>
      <div class="topbar-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="topbarSearch" placeholder="Search by Booking ID…">
      </div>
      <div class="topbar-actions">
        <div class="popover-anchor">
          <button class="icon-btn" data-popover-trigger="notifPopover" aria-label="Notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span class="dot" data-notif-dot></span>
          </button>
          <div class="popover" id="notifPopover">
            <div class="popover-head"><h4>Notifications</h4><button class="link-teal" data-notif-mark-all>Mark all read</button></div>
            <div class="popover-body" data-notif-body></div>
            <div class="popover-foot"><a href="my-repairs.html" class="link-teal">View all repairs</a></div>
          </div>
        </div>
        <div class="popover-anchor">
          <button class="icon-btn" data-popover-trigger="userPopover" aria-label="Account menu" style="width:auto;height:auto;border-radius:var(--radius-sm);padding:4px;">
            <span class="avatar" data-user-initials>AK</span>
          </button>
          <div class="popover" id="userPopover" style="width:270px;"></div>
        </div>
      </div>
    </header>

<main class="dash-content">
  <div class="page-head">
    <div>
      <h1>My Repairs</h1>
      <p>Track and manage all your repair requests in one place.</p>
    </div>
    <a href="book-repair.html" class="btn btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.4" stroke-linecap="round"/></svg>
      New Request
    </a>
  </div>

  <div class="toolbar-row">
    <div class="tab-row" id="filterTabs">
      <button class="tab-btn active" data-filter="all" onclick="setFilter('all')">All <span class="count" id="countAll">0</span></button>
      <button class="tab-btn" data-filter="active" onclick="setFilter('active')">Active <span class="count" id="countActive">0</span></button>
      <button class="tab-btn" data-filter="completed" onclick="setFilter('completed')">Completed <span class="count" id="countCompleted">0</span></button>
      <button class="tab-btn" data-filter="cancelled" onclick="setFilter('cancelled')">Cancelled <span class="count" id="countCancelled">0</span></button>
    </div>
    <div class="search-field" style="max-width:280px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="text" id="listSearch" placeholder="Search by item or Booking ID…">
    </div>
  </div>

  <div class="repair-list" id="list"></div>
</main>
  </div>
  </div>

<div class="toast-stack" id="toastStack"></div>

<script>
  let currentFilter = 'all';

  function repairIcon(catId){
    const map = {
      kitchen: '<path d="M6 3v6a3 3 0 006 0V3M9 9v12M17 3v18M15 3v6h4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
      home: '<rect x="4" y="4" width="16" height="16" rx="2" stroke-width="1.7"/><path d="M4 10h16M10 4v16" stroke-width="1.7"/>',
      audio: '<rect x="5" y="7" width="14" height="12" rx="2" stroke-width="1.7"/><circle cx="12" cy="13" r="3" stroke-width="1.7"/>',
      'power-tools': '<path d="M14 3l-9 11h6l-1 7 10-11h-6l1-7z" stroke-width="1.7" stroke-linejoin="round"/>',
      electrical: '<circle cx="12" cy="12" r="8" stroke-width="1.7"/><path d="M12 8v4l3 2" stroke-width="1.7" stroke-linecap="round"/>',
      watches: '<circle cx="12" cy="12" r="7" stroke-width="1.7"/><path d="M12 9v3l2 1.5" stroke-width="1.7" stroke-linecap="round"/>',
    };
    return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none">' + (map[catId] || map.home) + '</svg>';
  }

  function matchesFilter(r, filter){
    if(filter === 'active') return RP.isActiveStatus(r.status);
    if(filter === 'completed') return r.status === 'Delivered';
    if(filter === 'cancelled') return r.status === 'Cancelled';
    return true;
  }

  function cardHTML(r){
    return (
      '<div class="repair-list-item">' +
        '<div class="rli-icon">' + repairIcon(r.category) + '</div>' +
        '<div class="rli-main">' +
          '<div class="rli-id">' + r.id + '</div>' +
          '<div class="rli-title">' + r.item + (r.brand ? ' <span class="text-soft" style="font-weight:400;">· ' + r.brand + '</span>' : '') + '</div>' +
          '<div class="rli-meta">' +
            '<span>' + r.categoryName + '</span>' +
            '<span>· ' + RP.formatDate(r.createdAt) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="rli-right">' +
          RP.statusBadgeHTML(r.status) +
          (r.estimatedCost !== undefined ? '<div class="rli-cost"><b>' + RP.formatMoney(r.estimatedCost) + '</b><span>' + (r.status === 'Delivered' ? 'Paid' : 'Estimate') + '</span></div>' : '') +
          '<a href="repair-details.html?id=' + r.id + '" class="rli-view" aria-label="View details for ' + r.id + '">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</a>' +
        '</div>' +
      '</div>'
    );
  }

  function emptyHTML(hasSearch){
    return '<div class="card empty">' +
      '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' +
      '<h4>No repairs found</h4><p>' + (hasSearch ? 'Try a different search term, or clear it to see all repairs.' : 'Try a different filter, or book a new repair.') + '</p>' +
      (hasSearch ? '' : '<a href="book-repair.html" class="btn btn-primary btn-sm">Book a Repair</a>') +
      '</div>';
  }

  function render(){
    const q = (document.getElementById('listSearch').value || document.getElementById('topbarSearch').value || '').trim().toLowerCase();
    const all = RP.getRepairs();

    document.getElementById('countAll').textContent = all.length;
    document.getElementById('countActive').textContent = all.filter(r => RP.isActiveStatus(r.status)).length;
    document.getElementById('countCompleted').textContent = all.filter(r => r.status === 'Delivered').length;
    document.getElementById('countCancelled').textContent = all.filter(r => r.status === 'Cancelled').length;

    let list = all.filter(r => matchesFilter(r, currentFilter));
    if(q){
      list = list.filter(r => r.id.toLowerCase().includes(q) || r.item.toLowerCase().includes(q) || (r.categoryName||'').toLowerCase().includes(q));
    }
    document.getElementById('list').innerHTML = list.length ? list.map(cardHTML).join('') : emptyHTML(!!q);
  }

  function setFilter(filter){
    currentFilter = filter;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
    render();
  }

  document.addEventListener('DOMContentLoaded', function(){
    RP.initShell();

    // Deep-linking from the dashboard search box lands here with ?q=
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if(q){ document.getElementById('listSearch').value = q; document.getElementById('topbarSearch').value = q; }

    document.getElementById('listSearch').addEventListener('input', function(){
      document.getElementById('topbarSearch').value = this.value;
      render();
    });
    document.getElementById('topbarSearch').addEventListener('input', function(){
      document.getElementById('listSearch').value = this.value;
      render();
    });
    document.querySelectorAll('[data-notif-mark-all]').forEach(btn => btn.addEventListener('click', render));

    render();
  });
</script>
</body>
</html>
